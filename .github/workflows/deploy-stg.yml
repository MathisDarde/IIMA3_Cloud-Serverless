name: Deploy STG

on:
  push:
    branches:
      - staging

jobs:
  deploy-user:
    name: Deploy frontend-user to STG
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_front.py www-user stg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-admin:
    name: Deploy frontend-admin to STG
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_front.py www-admin stg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-assets:
    name: Deploy assets to STG
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_assets.py www-assets stg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_ASSETS: ${{ secrets.S3_BUCKET_ASSETS }}

  deploy-backend:
    name: Deploy backend to STG
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_api.py stg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DB_HOST: ${{ secrets.DB_HOST_STG }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_STG }}
          DB_NAME: ${{ secrets.DB_NAME_STG }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID_STG }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID_STG }}

  deploy-crons:
    name: Deploy crons to STG
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_crons.py stg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_CRON_STG: ${{ secrets.LAMBDA_CRON_STG }}
          DB_HOST: ${{ secrets.DB_HOST_STG }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_STG }}
          DB_NAME: ${{ secrets.DB_NAME_STG }}
          S3_BUCKET_ASSETS: ${{ secrets.S3_BUCKET_ASSETS }}
          S3_BUCKET_BACKUP: ${{ secrets.S3_BUCKET_BACKUP_STG }}
          S3_BACKUP_PREFIX: ${{ secrets.S3_BACKUP_PREFIX }}
