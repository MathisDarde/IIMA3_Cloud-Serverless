name: Deploy PRD

on:
  push:
    branches:
      - production

jobs:
  deploy-user:
    name: Deploy frontend-user to PRD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/www-user/package-lock.json

      - name: Install & Build
        working-directory: code/www-user
        run: |
          npm install
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync code/www-user/dist/ s3://${{ secrets.S3_BUCKET_PRD }}/user --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_USER_PRD }} --paths "/*"

  deploy-admin:
    name: Deploy frontend-admin to PRD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/www-admin/package-lock.json

      - name: Install & Build
        working-directory: code/www-admin
        run: |
          npm install
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync code/www-admin/dist/ s3://${{ secrets.S3_BUCKET_PRD }}/admin --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ADMIN_PRD }} --paths "/*"

  deploy-backend:
    name: Deploy backend to PRD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/api/lambda_hono/package-lock.json

      - name: Install & Build
        working-directory: code/api/lambda_hono
        run: |
          npm install
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package & Deploy to Lambda
        working-directory: code/api/lambda_hono
        run: |
          zip -r function.zip dist/ node_modules/
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PRD }} \
            --zip-file fileb://function.zip
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PRD }}
          aws lambda update-function-configuration \
            --function-name ${{ secrets.LAMBDA_FUNCTION_PRD }} \
            --environment "Variables={DB_HOST=${{ secrets.DB_HOST_PRD }},DB_PORT=${{ secrets.DB_PORT }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD_PRD }},DB_NAME=${{ secrets.DB_NAME_PRD }}}"
