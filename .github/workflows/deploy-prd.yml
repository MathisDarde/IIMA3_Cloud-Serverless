name: Deploy PRD

on:
  push:
    branches:
      - production

jobs:
  deploy-user:
    name: Deploy frontend-user to PRD
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_front.py www-user prd
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-admin:
    name: Deploy frontend-admin to PRD
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_front.py www-admin prd
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deploy-assets:
    name: Deploy assets to PRD
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_assets.py www-assets prd
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_ASSETS: ${{ secrets.S3_BUCKET_ASSETS }}

  deploy-backend:
    name: Deploy backend to PRD
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_api.py prd
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DB_HOST: ${{ secrets.DB_HOST_PRD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PRD }}
          DB_NAME: ${{ secrets.DB_NAME_PRD }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID_PRD }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID_PRD }}

  deploy-crons:
    name: Deploy crons to PRD
    runs-on: ubuntu-latest
    container:
      image: python:3.13
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -y && apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y nodejs
          pip install boto3 python-dotenv

      - name: Deploy
        run: python .github/scripts/deploy_crons.py prd
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          LAMBDA_CRON_PRD: ${{ secrets.LAMBDA_CRON_PRD }}
          DB_HOST: ${{ secrets.DB_HOST_PRD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_PRD }}
          DB_NAME: ${{ secrets.DB_NAME_PRD }}
          S3_BUCKET_ASSETS: ${{ secrets.S3_BUCKET_ASSETS }}
